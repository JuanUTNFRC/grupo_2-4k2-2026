{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}EcoHarmony Park{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/emblema.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
  <script src="{% static 'js/tema.js' %}"></script>
</head>
<body class="{% block clase_body %}{% endblock %}">
  <a class="saltar" href="#contenido">Ir al contenido</a>

  <header class="barra">
    <a class="marca" href="{% url 'inscripcion' %}">
      <img class="marca__icono" src="{% static 'img/emblema.svg' %}" alt="" width="36" height="36">
      <span>EcoHarmony <strong>Park</strong></span>
    </a>
    <div class="barra__acciones">
      {% if user.is_authenticated %}
      <span class="barra__email">{{ user.email }}</span>
      {% endif %}
      <button type="button" id="boton-tema" class="boton-tema" aria-label="Cambiar el tema">
        <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        </svg>
        <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="boton boton--fantasma">Salir</button>
      </form>
      {% endif %}
    </div>
  </header>

  <main id="contenido" tabindex="-1">
    {% block contenido %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
